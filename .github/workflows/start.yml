name: 综合备份 & 实时比分抓取

on:
  workflow_dispatch:
  
jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置北京时间
        id: set-time
        run: |
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV
          TIMESTAMP=$(TZ=Asia/Shanghai date +%Y%m%d_%H%M%S)
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          HOUR=$(TZ=Asia/Shanghai date +%H)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "hour=$HOUR" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: 创建文件夹结构
        run: |
          mkdir -p HisData

      - name: 下载最新XML（含失败重试与完整性校验）
        id: download
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          MIN_SIZE=300
          ITEMS=(
            "windrawwinfirsthalf.xml|https://www.macauslot.com/content/data/soccer/xml/odds/windrawwinfirsthalf.xml"
            "odds_config.xml|https://www.macauslot.com/content/data/soccer/xml/odds/odds_config.xml"
            "windrawwin.xml|https://www.macauslot.com/content/data/soccer/xml/odds/windrawwin.xml"
            "halffull.xml|https://www.macauslot.com/content/data/soccer/xml/odds/halffull.xml"
            "winodds.xml|https://www.macauslot.com/content/data/soccer/xml/odds/winodds.xml"
            "overunder.xml|https://www.macauslot.com/content/data/soccer/xml/odds/overunder.xml"
            "numberofgoals.xml|https://www.macauslot.com/content/data/soccer/xml/odds/numberofgoals.xml"
            "correctscore.xml|https://www.macauslot.com/content/data/soccer/xml/odds/correctscore.xml"
          )

          download_all() {
            for item in "${ITEMS[@]}"; do
              f="${item%%|*}"
              u="${item##*|}"
              curl -L -A "$UA" -o "$f" "$u"
            done
          }

          # 整体重试：最多 3 次，每次间隔 30 秒
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "🔄 XML 下载尝试 $ATTEMPT/$MAX_ATTEMPTS"
            download_all
            BAD=0
            for item in "${ITEMS[@]}"; do
              f="${item%%|*}"
              SIZE=$(wc -c < "$f" 2>/dev/null || echo 0)
              if [ "$SIZE" -lt $MIN_SIZE ]; then
                echo "⚠️ $f 仅 $SIZE 字节（<$MIN_SIZE），下载异常"
                BAD=1
              fi
            done
            if [ $BAD -eq 0 ]; then
              echo "✅ 全部文件均 >= $MIN_SIZE 字节，下载完整"
              break
            fi
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
              echo "⏳ 等待 30 秒后重试..."
              sleep 30
            fi
          done

          # 仅保留有效文件并生成清单；异常（<300B）文件直接删除，不参与上传
          : > valid_xmls.txt
          for item in "${ITEMS[@]}"; do
            f="${item%%|*}"
            SIZE=$(wc -c < "$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -ge $MIN_SIZE ]; then
              echo "$f" >> valid_xmls.txt
            else
              echo "🗑️ 排除异常文件 $f（$SIZE 字节）"
              rm -f "$f"
            fi
          done
          echo "📋 有效XML清单：" $(tr '\n' ' ' < valid_xmls.txt)

      - name: 归档XML到HisData时间戳文件夹
        run: |
          if [ -s valid_xmls.txt ]; then
            ARCHIVE_DIR="HisData/${{ env.TIMESTAMP }}"
            mkdir -p "$ARCHIVE_DIR"
            while read -r f; do
              [ -f "$f" ] && cp "$f" "$ARCHIVE_DIR/"
            done < valid_xmls.txt
            echo "✅ 已归档 $(wc -l < valid_xmls.txt) 个有效XML到 $ARCHIVE_DIR"
          else
            echo "⚠️ 无有效XML，跳过HisData归档"
          fi

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'

      - name: 缓存 Python 虚拟环境
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py312-

      - name: 安装 Python 依赖（仅当缓存未命中）
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 将虚拟环境加入 PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-py312-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-py312-

      - name: 安装 Playwright
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ 浏览器缓存命中，仅验证浏览器存在"
            playwright install chromium
          else
            echo "❌ 缓存未命中，安装 Chromium 及系统依赖"
            playwright install --with-deps chromium
          fi

      - name: 抓取 livescore 数据（失败自动重试）
        id: livescore
        run: |
          MAX_ATTEMPTS=2
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "🔄 livescore 尝试 $ATTEMPT/$MAX_ATTEMPTS"
            if python fetch_livescore.py; then
              echo "livescore_ok=true" >> $GITHUB_OUTPUT
              break
            fi
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
              echo "⏳ 等待 30 秒后重试..."
              sleep 30
            fi
          done
          if [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; then
            echo "⚠️ livescore 连续 $MAX_ATTEMPTS 次失败，跳过比分解析，继续上传"
            echo "livescore_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: 解析实时比分
        if: steps.livescore.outputs.livescore_ok == 'true'
        run: python scores_parser.py --input scores.json

      - name: 抓取 results 数据（失败自动重试）
        id: results
        run: |
          MAX_ATTEMPTS=2
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "🔄 results 尝试 $ATTEMPT/$MAX_ATTEMPTS"
            if python fetch_results.py; then
              echo "results_ok=true" >> $GITHUB_OUTPUT
              break
            fi
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
              echo "⏳ 等待 30 秒后重试..."
              sleep 30
            fi
          done
          if [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; then
            echo "⚠️ results 连续 $MAX_ATTEMPTS 次失败，跳过赛果解析，继续上传"
            echo "results_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: 解析 results.json 生成 history.csv
        if: steps.results.outputs.results_ok == 'true'
        run: python results_parser.py --input results.json --history history.csv --output history.csv

      - name: 安装 AWS CLI
        run: |
          pip install awscli
          aws --version

      - name: 上传生成文件到 Cloudflare R2
        run: |
          rm -rf upload_history upload_sync

          if [ -d "HisData" ] && [ "$(ls -A HisData)" ]; then
            mkdir -p upload_history/HisData
            cp -r HisData/* upload_history/HisData/
            echo "✅ HisData 已复制"
          else
            echo "⚠️ HisData 为空，跳过"
          fi

          mkdir -p upload_sync
          if [ -s valid_xmls.txt ]; then
            while read -r f; do
              [ -f "$f" ] && cp "$f" upload_sync/
            done < valid_xmls.txt
          else
            echo "⚠️ 无有效XML清单，尝试复制全部 .xml"
            cp *.xml upload_sync/ 2>/dev/null || echo "⚠️ 无 XML 文件"
          fi
          [ -f "scores_now.csv" ] && cp scores_now.csv upload_sync/
          [ -f "history.csv" ] && cp history.csv upload_sync/

          if [ -d "upload_history" ] && [ "$(ls -A upload_history)" ]; then
            aws s3 sync upload_history/ s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/history/ \
              --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

            echo "正在检查 R2 上的历史文件夹数量..."
            folders=$(aws s3 ls s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/history/HisData/ \
              --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
              | grep "/" \
              | awk '{print $2}' \
              | sort)

            total=$(echo "$folders" | wc -l)
            max_keep=72

            if [ $total -gt $max_keep ]; then
              remove_count=$((total - max_keep))
              echo "远程有 $total 个文件夹，需要删除最早的 $remove_count 个"
              echo "$folders" | head -n $remove_count | while read -r folder; do
                echo "删除旧文件夹: HisData/$folder"
                aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/history/HisData/$folder \
                  --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
                  --recursive
              done
              echo "✅ 已清理，远程剩余最新 $max_keep 个文件夹"
            else
              echo "远程有 $total 个文件夹，未超限，无需清理"
            fi
          fi

          if [ "$(ls -A upload_sync)" ]; then
            aws s3 sync upload_sync/ s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/latest/ \
              --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
              --delete
            echo "✅ 最新文件已同步"
          else
            echo "⚠️ 没有可同步的最新文件"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
