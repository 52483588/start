name: 综合备份 & 实时比分抓取


on:
  workflow_dispatch:

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== 1. 设置北京时间（无 sudo，全环境兼容） ==========
      - name: 设置北京时间
        id: set-time
        run: |
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV
          TIMESTAMP=$(TZ=Asia/Shanghai date +%Y%m%d_%H%M%S)
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          HOUR=$(TZ=Asia/Shanghai date +%H)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "hour=$HOUR" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: 创建文件夹结构
        run: |
          mkdir -p HisData 
          
       - name: 下载最新XML
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -L -A "$UA" -o windrawwinfirsthalf.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwinfirsthalf.xml"
          curl -L -A "$UA" -o odds_config.xml "https://www.macauslot.com/content/data/soccer/xml/odds/odds_config.xml"
          curl -L -A "$UA" -o windrawwin.xml "https://www.macauslot.com/content/data/soccer/xml/odds/windrawwin.xml"
          curl -L -A "$UA" -o halffull.xml "https://www.macauslot.com/content/data/soccer/xml/odds/halffull.xml"
          curl -L -A "$UA" -o winodds.xml "https://www.macauslot.com/content/data/soccer/xml/odds/winodds.xml"
          curl -L -A "$UA" -o overunder.xml "https://www.macauslot.com/content/data/soccer/xml/odds/overunder.xml"
          curl -L -A "$UA" -o numberofgoals.xml "https://www.macauslot.com/content/data/soccer/xml/odds/numberofgoals.xml"
          curl -L -A "$UA" -o correctscore.xml "https://www.macauslot.com/content/data/soccer/xml/odds/correctscore.xml"

      - name: 验证下载完整性
        run: |
          ALL_FILES=("windrawwinfirsthalf.xml" "odds_config.xml" "windrawwin.xml" "halffull.xml" "winodds.xml" "overunder.xml" "numberofgoals.xml" "correctscore.xml")
          for f in "${ALL_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "❌ 文件 $f 不存在或为空，下载失败"
              exit 1
            fi
          done
          echo "✅ 所有8个XML文件下载成功"

      # ---------- 创建本次时间戳文件夹并复制 XML ----------
      - name: 复制XML到HisData时间戳文件夹
        run: |
          ARCHIVE_DIR="HisData/${{ env.TIMESTAMP }}"
          mkdir -p "$ARCHIVE_DIR"
          cp *.xml "$ARCHIVE_DIR/"
          echo "✅ 已复制到 $ARCHIVE_DIR"

      # ---------- Python 环境 ----------
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'

      - name: 缓存 Python 虚拟环境
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py312-

      - name: 安装 Python 依赖（仅当缓存未命中）
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 将虚拟环境加入 PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      # ---------- Playwright 浏览器缓存 ----------
      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-py312-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-py312-

      - name: 安装 Playwright（缓存命中时只验证）
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "✅ 浏览器缓存命中，仅验证浏览器存在"
            playwright install chromium
          else
            echo "❌ 缓存未命中，安装 Chromium 及系统依赖"
            playwright install --with-deps chromium
          fi

      # ---------- 运行分析脚本（每小时执行） ----------
      - name: 抓取 livescore 数据
        run: python fetch_livescore.py

      - name: 解析实时比分
        run: python scores_parser.py --input scores.json

      - name: 抓取 results 数据（每小时）
        continue-on-error: true
        run: python fetch_results.py

      - name: 解析 results.json 生成/更新 history.csv（每小时）
        continue-on-error: true
        run: python results_parser.py --input results.json --history history.csv --output history.csv

      # ---------- 安装 AWS CLI ----------
      - name: 安装 AWS CLI
        run: |
          pip install awscli
          aws --version

      # ========== 上传到 Cloudflare R2 ==========
      - name: 上传生成文件到 Cloudflare R2
        run: |
          rm -rf upload_history upload_sync

          # ---- 1. 准备 HisData 目录（用于远程同步） ----
          if [ -d "HisData" ] && [ "$(ls -A HisData)" ]; then
            mkdir -p upload_history/HisData
            cp -r HisData/* upload_history/HisData/
            echo "✅ HisData 已复制"
          else
            echo "⚠️ HisData 为空，跳过"
          fi

          # ---- 2. 准备最新文件目录（包含所有需要覆盖的最新文件） ----
          mkdir -p upload_sync
          cp *.xml upload_sync/ 2>/dev/null || echo "⚠️ 无 XML 文件"
          [ -f "scores_now.csv" ] && cp scores_now.csv upload_sync/
          [ -f "history.csv" ] && cp history.csv upload_sync/   # 现在每小时都有

          # ---- 3. 同步 HisData 到 R2（保留历史，并清理远程多余的旧文件夹） ----
          if [ -d "upload_history" ] && [ "$(ls -A upload_history)" ]; then
            # 先上传新文件
            aws s3 sync upload_history/ s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/history/ \
              --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

            # 清理远程 HisData 文件夹，只保留最新 72 个
            echo "正在检查 R2 上的历史文件夹数量..."
            # 获取所有 HisData 子文件夹（按名称升序）
            folders=$(aws s3 ls s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/history/HisData/ \
              --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
              | grep "/" \
              | awk '{print $2}' \
              | sort)

            total=$(echo "$folders" | wc -l)
            max_keep=25

            if [ $total -gt $max_keep ]; then
              remove_count=$((total - max_keep))
              echo "远程有 $total 个文件夹，需要删除最早的 $remove_count 个"
              echo "$folders" | head -n $remove_count | while read -r folder; do
                echo "删除旧文件夹: HisData/$folder"
                aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/history/HisData/$folder \
                  --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
                  --recursive
              done
              echo "✅ 已清理，远程剩余最新 $max_keep 个文件夹"
            else
              echo "远程有 $total 个文件夹，未超限，无需清理"
            fi
          fi

          # ---- 4. 同步最新文件到 latest/（覆盖，且本地包含 history.csv） ----
          if [ "$(ls -A upload_sync)" ]; then
            aws s3 sync upload_sync/ s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.repository }}/latest/ \
              --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
              --delete
            echo "✅ 最新文件已同步（包含 history.csv）"
          else
            echo "⚠️ 没有可同步的最新文件"
          fi

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
