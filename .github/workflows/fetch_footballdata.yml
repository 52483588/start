name: Fetch Football-Data (Discover + History)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (history/weekly)'
        required: true
        default: 'history'
      leagues:
        description: 'Comma-separated league codes (leave empty for default)'
        required: false
  schedule:
    - cron: '0 6 * * SUN'  # 每周日 06:00 UTC → 每周六 14:00 北京时间

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run discover_leagues script
        run: |
          python3 - <<'EOF'
          import urllib.request, ssl, json, sys, time
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          CODES = {
              "E0","E1","E2","E3","SC0","L1","L2","L3","LD","UT","IU",
              "D1","D2","D3","SP1","SP2","I1","I2","I3","F1","F2","F3",
              "P1","P2","NL1","NL2","B1","B2","B3","GR1","GR2","GR3",
              "T1","T2","T3","S1","S2","DK1","DK2","NO1","NO2","SW1","SW2",
              "SC1","SC2","SC3","SC4","SC5","SCL","SL","KR1","KR2","KR3",
              "JA1","JA2","JA3","JA4","JA5","AU1","AU2","NZ1","CN1","CN2",
              "KR1","KR2","US1","US2","US3","CA1","CA2","CA3","MX1","MX2",
              "AR1","AR2","AR3","BR1","BR2","BR3","CI1","CI2","CI3","CO1","CO2",
              "PE1","PE2","UY1","PY1","EC1","VE1","BO1","IL1","IL2","SA1","SA2",
              "KE1","NG1","NG2","UG1","TZ1","TZ2","TZ3","RW1","ET1","MA1","DZ1","TN1",
              "RU1","RU2","UA1","UA2","FI1","FI2","CZ1","CZ2","PL1","PL2","HU1","HU2",
              "AT1","AT2","SK1","SI1","HR1","BA1","RS1","BG1","BG2","LT1","LV1","EE1",
              "BY1","AM1","GE1","AZ1"
          }
          SEASON = "2526"
          ok = []
          for code in CODES:
              url = f"https://www.football-data.co.uk/mmz4281/{SEASON}/{code}.csv"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10, context=ctx) as r:
                      if r.status == 200:
                          raw = r.read(500)
                          if b"HomeTeam" in raw or b"Date" in raw:
                              ok.append(code)
                              print(f"OK  {code}")
              except Exception as ex:
                  # skip
                  pass
          print(json.dumps(ok, ensure_ascii=False, indent=2))
          EOF
        id: discover

  fetch:
    needs: discover
    runs-on: ubuntu-24.04
    if: always() && (success() || contains(needs.discover.outputs.result, 'OK'))
    steps:
      - uses: actions/checkout@v4
      - name: Clear proxy env
        run: |
          rm -rf ~/.wgetrc
          echo "PROXY=" >> ~/.wgetrc

      - name: Prepare data directory
        run: mkdir -p data

      - name: Fetch football-data (history)
        if: github.event.inputs.mode == 'history'
        run: |
          python3 fetch_data.py footballdata \
            --league $g 'leagues' in github.event.inputs && github.event.inputs.leagues || 'E0,E1,D1,D2,SP1,SP2,I1,I2,F1,F2,P1,SW1,JA1,KR1,SC0,AT1,DK1,NO1,NL1,B1,P2,GR1,IL1,PL1,FI1,CZ1,UA1,RU1,TR1,SI1,HR1,BA1,RS1,BG1,BY1,AM1,GE1,AZ1' $ \
            --seasons 1516,1617,1718,1819,1920,2021,2122,2223,2324,2425,2526 \
            --out data/fd_history.csv


          if [ "$MODE" = "weekly" ]; then
            OUT="data/current.csv"
            ART="football-data-current"
          else
            OUT="data/history.csv"
            ART="football-data-history"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "seasons=$SEASONS" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "art=$ART" >> "$GITHUB_OUTPUT"
          echo "::notice::mode=$MODE seasons=$SEASONS out=$OUT"

      - name: Run fetcher
        env:
          LEAGUE: ${{ github.event.inputs.league || 'E0,E1,D1,D2,I1,I2,SP1,SP2,F1,F2,P1,SW1,J1,J2,K1,K2' }}
          SEASONS: ${{ steps.cfg.outputs.seasons }}
          OUT: ${{ steps.cfg.outputs.out }}
        run: |
          set -u
          echo "Python: $(python3 --version 2>&1)"
          echo "工作目录: $(pwd)"
          if [ ! -f fetch_data.py ]; then
            echo "::error::仓库根目录找不到 fetch_data.py！请把它和本 workflow 一起提交（与 .github/ 同级）。"
            ls -la
            exit 1
          fi
          mkdir -p data
          python3 -u fetch_data.py footballdata \
            --league "$LEAGUE" \
            --seasons "$SEASONS" \
            --out "$OUT"

      - name: List output
        if: always()
        run: ls -la data/ && echo "--- 首行 ---" && head -1 data/*.csv 2>/dev/null || true

      - name: Upload CSV as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.art }}
          path: ${{ steps.cfg.outputs.out }}
          retention-days: ${{ fromJSON(github.event.inputs.keep_artifact_days || '90') }}
