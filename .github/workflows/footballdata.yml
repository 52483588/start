name: Fetch football-data.co.uk

on:
  workflow_dispatch:
    inputs:
      league:
        description: '联赛代码逗号分隔（固定采集 2627 赛季；留空用默认21个）'
        required: false
        default: 'E0,E1,D1,D2,I1,I2,SP1,SP2,F1,F2,P1,SC0,NL1,B1,GR1,T1,DK1,NO1,BR1,CI1'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch per-league CSVs (season 2627)
        env:
          LEAGUE: ${{ github.event.inputs.league || 'E0,E1,D1,D2,I1,I2,SP1,SP2,F1,F2,P1,SC0,NL1,B1,GR1,T1,DK1,NO1,BR1,CI1' }}
          SEASONS: '2627'
        run: |
          set -u
          echo "Python: $(python3 --version 2>&1)"
          if [ ! -f fetch_data.py ]; then
            echo "::error::仓库根目录找不到 fetch_data.py！请把它和本 workflow 一起提交（与 .github/ 同级）。"
            ls -la
            exit 1
          fi
          IFS=',' read -ra LS <<< "$LEAGUE"
          for L in "${LS[@]}"; do
            L="$(echo -n "$L" | tr -d ' ')"
            [ -z "$L" ] && continue
            echo "=== 采集 $L ($SEASONS) ==="
            python3 -u fetch_data.py footballdata \
              --league "$L" \
              --seasons "$SEASONS" \
              --out "${L}.CSV" || echo "::warning::$L 采集失败，跳过"
          done
          echo "--- 根目录生成的 CSV ---"
          ls -1 *.CSV 2>/dev/null || echo "没有任何 CSV 生成"

      - name: List output
        if: always()
        run: |
          ls -la *.CSV 2>/dev/null || echo "（无 CSV 文件）"
          echo "--- 首行 ---"
          for f in *.CSV; do [ -f "$f" ] && { echo "## $f"; head -1 "$f"; }; done

      - name: 验证 AWS CLI
        run: aws --version

      - name: 上传到 Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -u
          # 把根目录生成的联赛 CSV 汇集到上传目录，避免直接 sync 仓库根目录误带 .git / 脚本等文件
          rm -rf upload_fd
          mkdir -p upload_fd
          shopt -s nullglob
          for f in *.CSV; do cp "$f" upload_fd/; done
          shopt -u nullglob
          if [ -z "$(ls -A upload_fd)" ]; then
            echo "::error::没有任何 CSV 可上传（可能全部联赛采集失败）"
            exit 1
          fi
          echo "准备上传以下文件到 R2:"
          ls -1 upload_fd/
          aws s3 sync upload_fd/ s3://${{ secrets.R2_BUCKET_NAME }}/52483588/start/football-data/ \
            --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          echo "::notice::已同步到 R2 前缀 52483588/start/football-data/"
