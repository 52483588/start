name: Fetch football-data.co.uk

on:
  workflow_dispatch:
    inputs:
      league:
        description: '联赛代码逗号分隔（固定采集 2627 赛季；留空用默认21个）'
        required: false
        default: 'E0,E1,D1,D2,I1,I2,SP1,SP2,F1,F2,P1,SC0,NL1,B1,GR1,T1,DK1,NO1,BR1,CI1'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch per-league CSVs (season 2627)
        env:
          LEAGUE: ${{ github.event.inputs.league || 'E0,E1,D1,D2,I1,I2,SP1,SP2,F1,F2,P1,SC0,NL1,B1,GR1,T1,DK1,NO1,BR1,CI1' }}
          SEASONS: '2627'
        run: |
          set -u
          echo "Python: $(python3 --version 2>&1)"
          if [ ! -f fetch_data.py ]; then
            echo "::error::仓库根目录找不到 fetch_data.py！请把它和本 workflow 一起提交（与 .github/ 同级）。"
            ls -la
            exit 1
          fi
          IFS=',' read -ra LS <<< "$LEAGUE"
          for L in "${LS[@]}"; do
            L="$(echo -n "$L" | tr -d ' ')"
            [ -z "$L" ] && continue
            echo "=== 采集 $L ($SEASONS) ==="
            python3 -u fetch_data.py footballdata \
              --league "$L" \
              --seasons "$SEASONS" \
              --out "${L}.CSV" || echo "::warning::$L 采集失败，跳过"
          done
          echo "--- 根目录生成的 CSV ---"
          ls -1 *.CSV 2>/dev/null || echo "没有任何 CSV 生成"

      - name: Normalize columns (union schema)
        run: |
          set -eu
          python3 - <<'PY'
          import csv, glob
          files = sorted(glob.glob("*.CSV"))
          if not files:
              print("无 CSV，跳过归一化"); raise SystemExit(0)
          preferred = ["E0.CSV", "E1.CSV", "SC0.CSV"]
          order = [f for f in preferred if f in files] + [f for f in files if f not in preferred]
          union, seen = [], set()
          def add(cols):
              for c in cols:
                  if c not in seen:
                      seen.add(c); union.append(c)
          for f in order:
              with open(f, newline='', encoding='utf-8') as fh:
                  try:
                      head = next(csv.reader(fh))
                  except StopIteration:
                      continue
                  add(head)
          print("并集列(%d): %s" % (len(union), ",".join(union)))
          for f in files:
              with open(f, newline='', encoding='utf-8') as fh:
                  rows = list(csv.DictReader(fh))
              with open(f, 'w', newline='', encoding='utf-8') as fh:
                  w = csv.DictWriter(fh, fieldnames=union, extrasaction='ignore')
                  w.writeheader()
                  for row in rows:
                      w.writerow({k: row.get(k, '') or '' for k in union})
              print("归一化 %s -> %d 列" % (f, len(union)))
          PY

      - name: List output
        if: always()
        run: |
          ls -la *.CSV 2>/dev/null || echo "（无 CSV 文件）"
          echo "--- 首行 + 列数 ---"
          for f in *.CSV; do [ -f "$f" ] && { echo "## $f ($(head -1 "$f" | awk -F, '{print NF}') 列)"; head -1 "$f"; }; done

      - name: 验证 AWS CLI
        run: aws --version

      - name: 上传到 Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -u
          # 把根目录生成的联赛 CSV 汇集到上传目录，避免直接 sync 仓库根目录误带 .git / 脚本等文件
          rm -rf upload_fd
          mkdir -p upload_fd
          shopt -s nullglob
          for f in *.CSV; do cp "$f" upload_fd/; done
          shopt -u nullglob
          if [ -z "$(ls -A upload_fd)" ]; then
            echo "::error::没有任何 CSV 可上传（可能全部联赛采集失败）"
            exit 1
          fi
          echo "准备上传以下文件到 R2:"
          ls -1 upload_fd/
          aws s3 sync upload_fd/ s3://${{ secrets.R2_BUCKET_NAME }}/52483588/start/football-data/ \
            --endpoint-url=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete
          echo "::notice::已同步到 R2 前缀 52483588/start/football-data/（--delete 严格镜像，仅保留最新）"
